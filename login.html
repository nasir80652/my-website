<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - JobFinder Pakistan</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', Arial, sans-serif; }
  body { background:linear-gradient(135deg, #0d47a1, #1976d2); display:flex; justify-content:center; align-items:center; min-height:100vh; padding:20px; }
  .box { background:#fff; padding:35px 25px; border-radius:18px; box-shadow:0 10px 30px rgba(0,0,0,0.25); width:100%; max-width:380px; }
  .box h2 { color:#0d47a1; text-align:center; margin-bottom:22px; font-size:22px; }
  .tabs { display:flex; margin-bottom:22px; border-radius:25px; overflow:hidden; background:#f0f2f5; padding:4px; }
  .tabs button { flex:1; padding:11px; border:none; background:transparent; color:#0d47a1; font-weight:bold; border-radius:20px; transition:all 0.2s; }
  .tabs button.active { background:#0d47a1; color:#fff; box-shadow:0 2px 6px rgba(13,71,161,0.3); }
  input { width:100%; padding:13px; margin-bottom:14px; border:2px solid #eee; border-radius:10px; font-size:15px; transition:border 0.2s; }
  input:focus { outline:none; border-color:#0d47a1; }
  .submit-btn { width:100%; padding:14px; background:linear-gradient(135deg, #ffb300, #ffa000); border:none; border-radius:10px; font-weight:bold; font-size:16px; box-shadow:0 4px 12px rgba(255,179,0,0.35); transition:transform 0.15s; }
  .submit-btn:active { transform:scale(0.97); }
  .msg { text-align:center; margin-top:14px; font-size:14px; font-weight:600; }
  .back-link { display:block; text-align:center; margin-top:18px; color:#0d47a1; text-decoration:none; font-weight:600; font-size:14px; }
</style>
</head>
<body>

<div class="box">
  <h2>🔎 JobFinder Pakistan</h2>

  <div class="tabs">
    <button id="loginTab" class="active" onclick="showLogin()">Login</button>
    <button id="signupTab" onclick="showSignup()">Signup</button>
  </div>

  <div id="loginForm">
    <input type="email" id="loginEmail" placeholder="📧 Email">
    <input type="password" id="loginPass" placeholder="🔒 Password">
    <button class="submit-btn" onclick="doLogin()">Login</button>
  </div>

  <div id="signupForm" style="display:none;">
    <input type="text" id="signupName" placeholder="👤 Full Name">
    <input type="email" id="signupEmail" placeholder="📧 Email">
    <input type="password" id="signupPass" placeholder="🔒 Password (6+ characters)">
    <button class="submit-btn" onclick="doSignup()">Create Account</button>
  </div>

  <p class="msg" id="message"></p>
  <a href="index.html" class="back-link">⬅ Back to Home</a>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDpyT6JP3BZaS_FEmlokWaY_-fE4tmjIQQ",
  authDomain: "jobfinder-pakistan.firebaseapp.com",
  projectId: "jobfinder-pakistan",
  storageBucket: "jobfinder-pakistan.firebasestorage.app",
  messagingSenderId: "823733669210",
  appId: "1:823733669210:web:99c3b484a1288412f73763"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.showLogin = function() {
  document.getElementById('loginForm').style.display = 'block';
  document.getElementById('signupForm').style.display = 'none';
  document.getElementById('loginTab').classList.add('active');
  document.getElementById('signupTab').classList.remove('active');
  document.getElementById('message').textContent = '';
};

window.showSignup = function() {
  document.getElementById('signupForm').style.display = 'block';
  document.getElementById('loginForm').style.display = 'none';
  document.getElementById('signupTab').classList.add('active');
  document.getElementById('loginTab').classList.remove('active');
  document.getElementById('message').textContent = '';
};

window.doLogin = function() {
  var email = document.getElementById('loginEmail').value;
  var pass = document.getElementById('loginPass').value;
  var msg = document.getElementById('message');

  if (email === '' || pass === '') {
    msg.style.color = 'red';
    msg.textContent = 'Email aur Password dono bharein';
    return;
  }

  signInWithEmailAndPassword(auth, email, pass)
    .then(function(userCredential) {
      msg.style.color = 'green';
      msg.textContent = 'Login successful!';
      setTimeout(function() { window.location.href = 'index.html'; }, 1000);
    })
    .catch(function(error) {
      msg.style.color = 'red';
      if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
        msg.textContent = 'Email ya Password ghalat hai';
      } else {
        msg.textContent = 'Error: ' + error.message;
      }
    });
};

window.doSignup = function() {
  var name = document.getElementById('signupName').value;
  var email = document.getElementById('signupEmail').value;
  var pass = document.getElementById('signupPass').value;
  var msg = document.getElementById('message');

  if (name === '' || email === '' || pass === '') {
    msg.style.color = 'red';
    msg.textContent = 'Tamam fields bharein';
    return;
  }

  if (pass.length < 6) {
    msg.style.color = 'red';
    msg.textContent = 'Password kam az kam 6 characters ka ho';
    return;
  }

  createUserWithEmailAndPassword(auth, email, pass)
    .then(function(userCredential) {
      updateProfile(userCredential.user, { displayName: name });
      msg.style.color = 'green';
      msg.textContent = 'Account ban gaya!';
      setTimeout(function() { window.location.href = 'index.html'; }, 1000);
    })
    .catch(function(error) {
      msg.style.color = 'red';
      if (error.code === 'auth/email-already-in-use') {
        msg.textContent = 'Yeh email pehle se registered hai';
      } else {
        msg.textContent = 'Error: ' + error.message;
      }
    });
};
</script>

</body>
</html>
