<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — JobFinder Pakistan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --navy:#10243E; --navy-deep:#0A1A2E; --amber:#E0983B; --cream:#FAF6EF; --paper:#FFFFFF; --ink:#20242C; --slate:#616B7A; --line:#E7E1D4; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--cream); color:var(--ink); font-family:'Inter',sans-serif; min-height:100vh; }
  h1 { font-family:'Fraunces',serif; font-weight:700; color:var(--navy); }
  a { color:inherit; text-decoration:none; }

  nav { display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid var(--line); }
  .nav-logo { font-family:'Fraunces',serif; font-size:19px; font-weight:700; color:var(--navy); }
  .nav-logo em { font-style:normal; color:var(--amber); }

  .wrap { padding:40px 22px; max-width:420px; margin:0 auto; }
  .wrap h1 { font-size:25px; margin-bottom:6px; }
  .wrap > p { font-size:13px; color:var(--slate); margin-bottom:24px; }

  .tabs { display:flex; background:#EFE9DB; border-radius:10px; padding:4px; margin-bottom:24px; }
  .tab { flex:1; text-align:center; padding:10px; border-radius:8px; font-size:13.5px; font-weight:600; cursor:pointer; color:var(--slate); }
  .tab.active { background:#fff; color:var(--navy); box-shadow:0 2px 6px rgba(0,0,0,0.08); }

  form { display:flex; flex-direction:column; gap:14px; }
  label { font-size:12.5px; font-weight:600; color:var(--ink); margin-bottom:5px; display:block; }
  input, select { width:100%; padding:12px 13px; border-radius:9px; border:1px solid var(--line); font-size:14px; background:#fff; font-family:'Inter',sans-serif; }
  input:focus, select:focus { outline:2px solid var(--amber); border-color:var(--amber); }

  .signup-only { display:none; }
  body.signup-mode .signup-only { display:block; }
  body.signup-mode .login-only { display:none; }

  button[type=submit] {
    margin-top:6px; background:var(--navy); color:#fff; border:none; padding:13px; border-radius:9px;
    font-weight:700; font-size:14.5px; transition:transform .15s ease;
  }
  button[type=submit]:active { transform:scale(0.97); }

  .switch-line { text-align:center; font-size:12.5px; color:var(--slate); margin-top:18px; }
  .switch-line span { color:var(--navy); font-weight:700; cursor:pointer; }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">Job<em>Finder</em></a>
</nav>

<div class="wrap">
  <h1 class="tab-title">Welcome back</h1>
  <p class="tab-sub">Log in to manage your applications</p>

  <div class="tabs">
    <div class="tab active" id="tabLogin" onclick="setMode(false)">Login</div>
    <div class="tab" id="tabSignup" onclick="setMode(true)">Signup</div>
  </div>

  <form onsubmit="event.preventDefault(); alert('This is a demo form — connect it to a backend to make it live.');">
    <div class="signup-only">
      <label>Full name</label>
      <input type="text" placeholder="Your name">
    </div>
    <div>
      <label>Email</label>
      <input type="email" placeholder="you@example.com" required>
    </div>
    <div>
      <label>Password</label>
      <input type="password" placeholder="••••••••" required>
    </div>
    <div class="signup-only">
      <label>I am a</label>
      <select>
        <option>Job Seeker</option>
        <option>Employer</option>
      </select>
    </div>
    <button type="submit" id="submitBtn">Log in</button>
  </form>

  <div class="switch-line login-only">Don't have an account? <span onclick="setMode(true)">Sign up</span></div>
  <div class="switch-line signup-only">Already have an account? <span onclick="setMode(false)">Log in</span></div>
</div>

<script>
  function setMode(signup) {
    document.body.classList.toggle('signup-mode', signup);
    document.getElementById('tabLogin').classList.toggle('active', !signup);
    document.getElementById('tabSignup').classList.toggle('active', signup);
    document.querySelector('.tab-title').textContent = signup ? 'Create your account' : 'Welcome back';
    document.querySelector('.tab-sub').textContent = signup ? 'Sign up to start applying for jobs' : 'Log in to manage your applications';
    document.getElementById('submitBtn').textContent = signup ? 'Create account' : 'Log in';
  }
</script>

</body>
</html>
