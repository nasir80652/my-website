<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search Jobs — JobFinder Pakistan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --navy:#10243E; --navy-deep:#0A1A2E; --amber:#E0983B; --cream:#FAF6EF; --paper:#FFFFFF; --ink:#20242C; --slate:#616B7A; --sage:#5C8C6E; --line:#E7E1D4; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--cream); color:var(--ink); font-family:'Inter',sans-serif; line-height:1.5; }
  h1,h2 { font-family:'Fraunces',serif; font-weight:700; color:var(--navy); }
  a { color:inherit; }

  nav { display:flex; justify-content:space-between; align-items:center; padding:16px 20px; background:var(--cream); position:sticky; top:0; z-index:20; border-bottom:1px solid var(--line); }
  .nav-logo { font-family:'Fraunces',serif; font-size:19px; font-weight:700; color:var(--navy); text-decoration:none; }
  .nav-logo em { font-style:normal; color:var(--amber); }
  .nav-menu a { text-decoration:none; color:var(--ink); font-weight:500; font-size:13px; }

  .search-head { background:var(--navy); padding:22px 20px 26px; }
  .search-head h1 { color:#fff; font-size:20px; margin-bottom:14px; }
  .search-box { background:#fff; border-radius:10px; padding:5px; display:flex; align-items:center; margin-bottom:12px; }
  .search-box input { flex:1; border:none; outline:none; padding:11px 10px; font-size:14.5px; color:var(--ink); font-family:'Inter',sans-serif; }
  .search-box button { background:var(--amber); border:none; color:var(--navy-deep); font-weight:700; padding:11px 16px; border-radius:7px; font-size:13.5px; }

  .filters { display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; }
  .filter-chip { background:rgba(255,255,255,0.12); color:#fff; padding:8px 14px; border-radius:100px; font-size:12.5px; font-weight:600; flex-shrink:0; }
  .filter-chip.active { background:var(--amber); color:var(--navy-deep); }

  .section { padding:24px 20px; }
  .result-count { font-size:12.5px; color:var(--slate); margin-bottom:14px; }

  .job-card { background:var(--paper); border-radius:12px; padding:18px; margin-bottom:13px; display:flex; gap:14px; align-items:center; text-decoration:none; color:var(--ink); border-left:3px solid var(--navy); border-top:1px solid var(--line); border-right:1px solid var(--line); border-bottom:1px solid var(--line); }
  .job-card img { width:50px; height:50px; border-radius:10px; flex-shrink:0; }
  .job-info h3 { font-size:16px; margin-bottom:3px; font-family:'Inter',sans-serif; color:var(--ink); font-weight:700; }
  .job-info p { font-size:12.5px; color:var(--slate); margin-top:2px; }
  .salary-tag { display:inline-block; background:#E7F0EA; color:var(--sage); font-weight:700; font-size:11.5px; padding:3px 9px; border-radius:100px; margin-top:5px; }

  .empty { text-align:center; padding:40px 20px; color:var(--slate); font-size:13.5px; }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">Job<em>Finder</em></a>
  <div class="nav-menu"><a href="post-job.html">Post a job</a></div>
</nav>

<div class="search-head">
  <h1>Find your next job</h1>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Job title or keyword">
    <button onclick="runSearch()">Search</button>
  </div>
  <div class="filters" id="filters">
    <div class="filter-chip active" data-cat="all">All</div>
    <div class="filter-chip" data-cat="IT">IT & Software</div>
    <div class="filter-chip" data-cat="Marketing">Marketing</div>
    <div class="filter-chip" data-cat="Accounting">Accounting</div>
    <div class="filter-chip" data-cat="Teaching">Teaching</div>
  </div>
</div>

<div class="section">
  <div class="result-count" id="resultCount">Showing all jobs</div>
  <div id="results"></div>
</div>

<script>
  const baseJobs = [
    { title:"Web Developer", company:"TechSol Pvt Ltd", location:"Lahore", salary:"60,000 PKR", category:"IT", color:"10243E" },
    { title:"Graphic Designer", company:"Creative Studio", location:"Karachi", salary:"45,000 PKR", category:"Marketing", color:"E0983B" },
    { title:"Sales Executive", company:"MegaMart", location:"Islamabad", salary:"40,000 PKR", category:"Marketing", color:"5C8C6E" }
  ];

  function getAllJobs() {
    const posted = JSON.parse(localStorage.getItem('jf_jobs') || '[]');
    return baseJobs.concat(posted);
  }

  let activeCat = 'all';

  function renderJobs() {
    const query = document.getElementById('searchInput').value.trim().toLowerCase();
    const jobs = getAllJobs().filter(j => {
      const matchesQuery = !query || j.title.toLowerCase().includes(query) || j.company.toLowerCase().includes(query) || j.location.toLowerCase().includes(query);
      const matchesCat = activeCat === 'all' || j.category === activeCat;
      return matchesQuery && matchesCat;
    });

    const results = document.getElementById('results');
    document.getElementById('resultCount').textContent = jobs.length + (jobs.length === 1 ? ' job found' : ' jobs found');

    if (jobs.length === 0) {
      results.innerHTML = '<div class="empty">No jobs match your search yet. Try a different keyword.</div>';
      return;
    }

    results.innerHTML = jobs.map(j => `
      <a href="job-details.html?title=${encodeURIComponent(j.title)}&company=${encodeURIComponent(j.company)}&location=${encodeURIComponent(j.location)}&salary=${encodeURIComponent(j.salary)}" class="job-card">
        <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(j.company)}&background=${j.color||'10243E'}&color=fff&size=100">
        <div class="job-info">
          <h3>${j.title}</h3>
          <p>${j.company} · ${j.location}</p>
          <span class="salary-tag">${j.salary}</span>
        </div>
      </a>
    `).join('');
  }

  function runSearch() { renderJobs(); }

  document.getElementById('searchInput').addEventListener('input', renderJobs);
  document.querySelectorAll('.filter-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      activeCat = chip.dataset.cat;
      renderJobs();
    });
  });

  const params = new URLSearchParams(window.location.search);
  if (params.get('q')) document.getElementById('searchInput').value = params.get('q');

  renderJobs();
</script>

</body>
</html>
