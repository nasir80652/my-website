<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post a Job — JobFinder Pakistan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --navy:#10243E; --navy-deep:#0A1A2E; --amber:#E0983B; --cream:#FAF6EF; --paper:#FFFFFF; --ink:#20242C; --slate:#616B7A; --sage:#5C8C6E; --line:#E7E1D4; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--cream); color:var(--ink); font-family:'Inter',sans-serif; }
  h1 { font-family:'Fraunces',serif; font-weight:700; color:var(--navy); }
  a { color:inherit; text-decoration:none; }

  nav { display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid var(--line); }
  .nav-logo { font-family:'Fraunces',serif; font-size:19px; font-weight:700; color:var(--navy); }
  .nav-logo em { font-style:normal; color:var(--amber); }

  .wrap { padding:30px 20px 50px; max-width:460px; margin:0 auto; }
  .wrap h1 { font-size:23px; margin-bottom:6px; }
  .wrap > p { font-size:13px; color:var(--slate); margin-bottom:24px; }

  form { display:flex; flex-direction:column; gap:16px; }
  label { font-size:12.5px; font-weight:600; color:var(--ink); margin-bottom:5px; display:block; }
  input, select, textarea { width:100%; padding:12px 13px; border-radius:9px; border:1px solid var(--line); font-size:14px; background:#fff; font-family:'Inter',sans-serif; }
  textarea { resize:vertical; min-height:90px; }
  input:focus, select:focus, textarea:focus { outline:2px solid var(--amber); border-color:var(--amber); }

  .row { display:flex; gap:10px; }
  .row > div { flex:1; }

  button[type=submit] { margin-top:6px; background:var(--amber); color:var(--navy-deep); border:none; padding:14px; border-radius:100px; font-weight:700; font-size:14.5px; transition:transform .15s ease; }
  button[type=submit]:active { transform:scale(0.97); }

  .success { display:none; text-align:center; padding:40px 20px; }
  .success.show { display:block; }
  .success-icon { width:60px; height:60px; border-radius:50%; background:#E7F0EA; color:var(--sage); font-size:28px; display:flex; align-items:center; justify-content:center; margin:0 auto 16px; }
  .success h2 { font-family:'Fraunces',serif; color:var(--navy); font-size:20px; margin-bottom:8px; }
  .success p { font-size:13px; color:var(--slate); margin-bottom:20px; }
  .success a { display:inline-block; background:var(--navy); color:#fff; padding:11px 22px; border-radius:100px; font-weight:600; font-size:13px; }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">Job<em>Finder</em></a>
</nav>

<div class="wrap">
  <div id="formView">
    <h1>Post a job</h1>
    <p>Reach thousands of job seekers across Pakistan in minutes.</p>

    <form id="jobForm">
      <div>
        <label>Job title</label>
        <input type="text" id="jTitle" placeholder="e.g. Web Developer" required>
      </div>
      <div>
        <label>Company name</label>
        <input type="text" id="jCompany" placeholder="e.g. TechSol Pvt Ltd" required>
      </div>
      <div class="row">
        <div>
          <label>Location</label>
          <input type="text" id="jLocation" placeholder="e.g. Lahore" required>
        </div>
        <div>
          <label>Salary (PKR)</label>
          <input type="text" id="jSalary" placeholder="e.g. 50,000" required>
        </div>
      </div>
      <div>
        <label>Category</label>
        <select id="jCategory">
          <option value="IT">IT & Software</option>
          <option value="Marketing">Marketing</option>
          <option value="Accounting">Accounting</option>
          <option value="Teaching">Teaching</option>
          <option value="Driver">Driver</option>
          <option value="Support">Customer Support</option>
        </select>
      </div>
      <div>
        <label>Job description</label>
        <textarea id="jDesc" placeholder="Describe the role, responsibilities and requirements"></textarea>
      </div>
      <button type="submit">Post job</button>
    </form>
  </div>

  <div class="success" id="successView">
    <div class="success-icon">✓</div>
    <h2>Job posted</h2>
    <p>Your listing is now live on JobFinder Pakistan.</p>
    <a href="index.html">Back to home</a>
  </div>
</div>

<script>
  document.getElementById('jobForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const job = {
      title: document.getElementById('jTitle').value,
      company: document.getElementById('jCompany').value,
      location: document.getElementById('jLocation').value,
      salary: document.getElementById('jSalary').value + ' PKR',
      category: document.getElementById('jCategory').value,
      description: document.getElementById('jDesc').value,
      color: ['10243E','E0983B','5C8C6E','7A5C99','B45B4A'][Math.floor(Math.random()*5)]
    };
    const jobs = JSON.parse(localStorage.getItem('jf_jobs') || '[]');
    jobs.push(job);
    localStorage.setItem('jf_jobs', JSON.stringify(jobs));

    document.getElementById('formView').style.display = 'none';
    document.getElementById('successView').classList.add('show');
  });
</script>

</body>
 </html>
